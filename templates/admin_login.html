{% extends 'admin_base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
  <h1 class="admin-title">Вход администратора</h1>
  <section class="contact-card admin-login-card" aria-label="Форма входа">
    {% if not configured %}
      <p class="admin-notice">Пароль ещё не задан. Один раз выполни в терминале: <code>python setup_admin.py</code></p>
    {% endif %}
    {% if error %}
      <p class="admin-error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ url_for('admin_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-field">
        <label for="admin-password">Пароль</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <button class="button button-primary submit-button" type="submit">Войти</button>
    </form>
  </section>
{% endblock %}
